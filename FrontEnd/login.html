
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Sophie Bluel</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./assets/style.css">
    <script src="./assets/scripts/login.js" defer></script>
</head>

<body>
    <header>
        <h1>
            Sophie Bluel
            <span>Architecte d'intérieur</span>
        </h1>

        <nav aria-label="Navigation principale">
            <ul>
                <li><a href="./index.html#portfolio">projets</a></li>
                <li><a href="./index.html#contact">contact</a></li>
                <li><a href="./login.html" aria-current="page">login</a></li>
                <li>
                    <a href="https://www.instagram.com/"
                       target="_blank"
                       rel="noopener noreferrer"
                       aria-label="Instagram">
                        <img src="./assets/icons/instagram.png" alt="">
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="login">
            <h2>Log In</h2>
            
            <p id="login-error" class="error-message" role="alert" aria-live="polite"></p>

            <form action="#" method="post">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >

                <label for="password">Mot de passe</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >

                <input type="submit" value="Se connecter">

                <a href="#" class="forgot-password">
                    Mot de passe oublié
                </a>
            </form>
        </section>
    </main>

    <footer>
        <nav aria-label="Navigation de pied de page">
            <ul>
                <li><a href="#">Mentions Légales</a></li>
            </ul>
        </nav>
    </footer>
</body>
</html>
